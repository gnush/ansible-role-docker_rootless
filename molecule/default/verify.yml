---
- name: Verify
  hosts: all
  vars_files:
    - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
    - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/vars/main.yml"
  pre_tasks:
    # Mirrors converge.yml: its vars do not reach this playbook, and
    # vars_files outranks play vars, so a set_fact is the only thing that beats
    # the default read above.
    - name: Use the port driver converge applied
      ansible.builtin.set_fact:
        docker_port_driver: slirp4netns
  tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:

    # The role lets the system pick the uid, and `docker_user_env` derives from
    # it, so read the assigned id rather than a default.
    - name: Read the uid the system assigned to the service user
      ansible.builtin.getent:
        database: passwd
        key: "{{ docker_service_user }}"

    - name: Record the service user's uid
      ansible.builtin.set_fact:
        docker_service_uid: "{{ ansible_facts['getent_passwd'][docker_service_user][1] }}"

    # The host kernel is already permissive, so a working daemon does not prove
    # the role's userns branch ran. Check what it wrote instead.
    - name: Read the AppArmor restriction on unprivileged user namespaces
      ansible.builtin.slurp:
        src: /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      register: userns_restrict
      failed_when: false

    - name: Stat the user namespace artefacts
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/apparmor.d/usr.bin.rootlesskit
        - /etc/sysctl.d/50-unprivileged-userns.conf
      register: userns_files
      changed_when: false

    - name: Assert the AppArmor branch wrote the rootlesskit profile
      ansible.builtin.assert:
        that: userns_files.results[0].stat.exists
      when: userns_restrict.content | default('') | b64decode | trim == '1'

    - name: Assert the sysctl branch wrote the unprivileged userns settings
      ansible.builtin.assert:
        that: userns_files.results[1].stat.exists
      when: userns_restrict.content | default('') | b64decode | trim != '1'

    # A unit that was never loaded is absent from service_facts rather than stopped.
    - name: Check the system-wide daemon is off
      ansible.builtin.assert:
        that:
          - (ansible_facts.services['docker.service'] | default({})).get('status') != 'enabled'
          - (ansible_facts.services['docker.service'] | default({})).get('state') != 'running'

    # Each of these is run as the service user: the socket and the user manager
    # only exist inside the service user's session.
    - name: Read the rootless daemon state
      become: true
      become_user: "{{ docker_service_user }}"
      environment: "{{ docker_user_env }}"
      ansible.builtin.systemd_service:
        name: docker.service
        scope: user
      register: docker_user_unit
      changed_when: false
      check_mode: false

    - name: Assert the rootless daemon is running and enabled
      ansible.builtin.assert:
        that:
          - docker_user_unit.status.ActiveState == 'active'
          - docker_user_unit.status.UnitFileState == 'enabled'

    # The drop-in existing proves the role wrote it; Environment on the unit
    # proves systemd applied it to the process the daemon runs in.
    - name: Stat the port driver drop-in
      ansible.builtin.stat:
        path: "{{ docker_service_home }}/.config/systemd/user/docker.service.d/port-driver.conf"
      register: docker_port_driver_dropin

    - name: Read the port driver the unit runs with  # noqa: command-instead-of-module
      become: true
      become_user: "{{ docker_service_user }}"
      environment: "{{ docker_user_env }}"
      # systemd_service reports no Environment property, so the module cannot
      # answer this.
      ansible.builtin.command: systemctl --user show docker.service --property=Environment
      register: docker_port_driver_env
      changed_when: false
      check_mode: false

    - name: Assert the port driver is configured
      ansible.builtin.assert:
        that:
          - docker_port_driver_dropin.stat.exists
          - ("DOCKERD_ROOTLESS_ROOTLESSKIT_PORT_DRIVER=" ~ docker_port_driver) in docker_port_driver_env.stdout
        fail_msg: >-
          {{ docker_port_driver }} not applied; unit has
          {{ docker_port_driver_env.stdout }}

    - name: Check the daemon reports itself rootless
      become: true
      become_user: "{{ docker_service_user }}"
      environment: "{{ docker_user_env }}"
      ansible.builtin.command: docker info --format '{% raw %}{{ .SecurityOptions }}{% endraw %}'
      register: docker_info
      changed_when: false
      failed_when: docker_info.stdout is not search('rootless')

    - name: Check the socket is owned by the service user
      ansible.builtin.stat:
        path: "{{ docker_user_runtime_dir }}/docker.sock"
      register: docker_sock

    - name: Assert the socket belongs to the service user
      ansible.builtin.assert:
        that:
          - docker_sock.stat.exists
          - docker_sock.stat.uid | int == docker_service_uid | int

    - name: Pull and run a container as the service user
      become: true
      become_user: "{{ docker_service_user }}"
      environment: "{{ docker_user_env }}"
      ansible.builtin.command: docker run --rm hello-world
      register: docker_run
      changed_when: false

    - name: Assert the container ran
      ansible.builtin.assert:
        that: "'Hello from Docker' in docker_run.stdout"

    # Reading the files rather than getsubids, which is newer than Debian 12.
    # Overlap is the point: two accounts mapping the same outer ids does not make
    # newuidmap fail, it just means one can touch the files the other creates.
    - name: Stat the subordinate id files
      ansible.builtin.stat:
        path: "/etc/{{ item }}"
      loop:
        - subuid
        - subgid
      register: docker_subid_files

    - name: Assert useradd wrote both subordinate id files
      ansible.builtin.assert:
        that: docker_subid_files.results | selectattr('stat.exists') | list | length == 2

    # The file is passed twice: the first pass records the service user's range,
    # the second compares every other entry against it.
    - name: Check the service user's range against every other entry
      ansible.builtin.shell: |
        awk -F: -v u='{{ docker_service_user }}' -v uid='{{ docker_service_uid }}' '
          NR == FNR {
            if ($1 == u || $1 == uid) {
              seen = 1
              lo = $2
              hi = $2 + $3
            }
            next
          }
          seen && $1 != u && $1 != uid && $2 < hi && lo < $2 + $3 {
            printf "%s:%s:%s overlaps %s\n", $1, $2, $3, u
            bad = 1
          }
          END {
            if (!seen) { print "no range for " u; exit 2 }
            exit bad
          }
        ' /etc/{{ item }} /etc/{{ item }}
      args:
        executable: /bin/bash
      loop:
        - subuid
        - subgid
      register: docker_subid_check
      changed_when: false
      failed_when: false

    - name: Assert the subordinate id range is present and does not overlap
      vars:
        subid_errors: >-
          {{ docker_subid_check.results | rejectattr('rc', 'equalto', 0)
             | map(attribute='stdout') | select | join('; ') }}
      ansible.builtin.assert:
        that: docker_subid_check.results | map(attribute='rc') | unique == [0]
        fail_msg: "subordinate id check failed: {{ subid_errors }}"
