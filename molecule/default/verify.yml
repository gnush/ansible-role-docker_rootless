---
- name: Verify
  hosts: all
  vars_files:
    - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
    - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/vars/main.yml"
  tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:

    # The role lets the system pick the uid, and `docker_user_env` derives from
    # it, so read the assigned id rather than a default.
    - name: Read the uid the system assigned to the service user
      ansible.builtin.getent:
        database: passwd
        key: "{{ docker_service_user }}"

    - name: Record the service user's uid
      ansible.builtin.set_fact:
        docker_service_uid: "{{ ansible_facts['getent_passwd'][docker_service_user][1] }}"

    # The host kernel is already permissive, so a working daemon does not prove
    # the role's userns branch ran. Check what it wrote instead.
    - name: Read the AppArmor restriction on unprivileged user namespaces
      ansible.builtin.slurp:
        src: /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      register: userns_restrict
      failed_when: false

    - name: Stat the user namespace artefacts
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/apparmor.d/usr.bin.rootlesskit
        - /etc/sysctl.d/50-unprivileged-userns.conf
      register: userns_files
      changed_when: false

    - name: Assert the AppArmor branch wrote the rootlesskit profile
      ansible.builtin.assert:
        that: userns_files.results[0].stat.exists
      when: userns_restrict.content | default('') | b64decode | trim == '1'

    - name: Assert the sysctl branch wrote the unprivileged userns settings
      ansible.builtin.assert:
        that: userns_files.results[1].stat.exists
      when: userns_restrict.content | default('') | b64decode | trim != '1'

    # A unit that was never loaded is absent from service_facts rather than stopped.
    - name: Check the system-wide daemon is off
      ansible.builtin.assert:
        that:
          - (ansible_facts.services['docker.service'] | default({})).get('status') != 'enabled'
          - (ansible_facts.services['docker.service'] | default({})).get('state') != 'running'

    # Each of these is run as the service user: the socket and the user manager
    # only exist inside the service user's session.
    - name: Read the rootless daemon state
      become: true
      become_user: "{{ docker_service_user }}"
      environment: "{{ docker_user_env }}"
      ansible.builtin.systemd_service:
        name: docker.service
        scope: user
      register: docker_user_unit
      changed_when: false
      check_mode: false

    - name: Assert the rootless daemon is running and enabled
      ansible.builtin.assert:
        that:
          - docker_user_unit.status.ActiveState == 'active'
          - docker_user_unit.status.UnitFileState == 'enabled'

    - name: Check the daemon reports itself rootless
      become: true
      become_user: "{{ docker_service_user }}"
      environment: "{{ docker_user_env }}"
      ansible.builtin.command: docker info --format '{% raw %}{{ .SecurityOptions }}{% endraw %}'
      register: docker_info
      changed_when: false
      failed_when: docker_info.stdout is not search('rootless')

    - name: Check the socket is owned by the service user
      ansible.builtin.stat:
        path: "{{ docker_user_runtime_dir }}/docker.sock"
      register: docker_sock

    - name: Assert the socket belongs to the service user
      ansible.builtin.assert:
        that:
          - docker_sock.stat.exists
          - docker_sock.stat.uid | int == docker_service_uid | int

    - name: Pull and run a container as the service user
      become: true
      become_user: "{{ docker_service_user }}"
      environment: "{{ docker_user_env }}"
      ansible.builtin.command: docker run --rm hello-world
      register: docker_run
      changed_when: false

    - name: Assert the container ran
      ansible.builtin.assert:
        that: "'Hello from Docker' in docker_run.stdout"

    # getsubids ships with uidmap >= 1:4.9, which 24.04 has; reading the files
    # works on any release.
    - name: Read the subordinate id ranges
      ansible.builtin.command: "grep -E '^{{ docker_service_user }}:' /etc/{{ item }}"
      loop:
        - subuid
        - subgid
      register: docker_subid
      changed_when: false

    - name: Assert the service user has subordinate ids
      ansible.builtin.assert:
        that: docker_subid.results | map(attribute='stdout') | map('trim') | map('length') | min > 0
