---
- name: Restart apparmor
  ansible.builtin.systemd_service:
    name: apparmor.service
    state: restarted

- name: Restart rootless docker
  become: true
  become_user: "{{ docker_service_user }}"
  environment: "{{ docker_user_env }}"
  ansible.builtin.systemd_service:
    name: docker.service
    scope: user
    # the reload picks up the drop-in, the restart the daemon config.
    daemon_reload: true
    state: restarted
