---
- name: Fail on unsupported distribution
  ansible.builtin.assert:
    that: >-
      (ansible_facts['distribution'] == 'Ubuntu' and
       ansible_facts['distribution_major_version'] | int >= 24) or
      (ansible_facts['distribution'] == 'Debian' and
       ansible_facts['distribution_major_version'] | int >= 12)
    fail_msg: >-
      This role supports Ubuntu >= 24.04 and Debian >= 12 (found
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}).

- name: Fail on unsupported architecture
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in docker_apt_arch_map
    fail_msg: "No Docker apt repository for {{ ansible_facts['architecture'] }}."

# --------------------------------------------------------------------------
# Packages
# --------------------------------------------------------------------------

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - uidmap          # newuidmap/newgidmap, required for the user namespace
      - slirp4netns     # rootless network namespace
      - dbus-user-session
      - python3-debian  # deb822_repository below
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# The role owns Docker's apt source.
# The legacy one-line list is removed so the source is not duplicated
- name: Remove the legacy one-line Docker apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "{{ docker_apt_repo_url }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["{{ docker_apt_arch_map[ansible_facts['architecture']] }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    enabled: true
    state: present

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: "{{ docker_packages_state }}"
    update_cache: true

# Feeds the check that the running daemon predates the installed packages.
- name: Read the installed Docker version
  ansible.builtin.command: docker --version
  register: docker_cli_version_out
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record the installed Docker version
  ansible.builtin.set_fact:
    docker_installed_version: "{{ docker_cli_version_out.stdout | default('') | regex_search('\\d+\\.\\d+\\.\\d+') | default('', true) }}"

# --------------------------------------------------------------------------
# The system-wide daemon stays off — everything runs rootless.
# --------------------------------------------------------------------------

- name: Disable the system-wide Docker daemon
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - docker.service
    - docker.socket

# --------------------------------------------------------------------------
# Service user
# --------------------------------------------------------------------------

# No fixed uid/gid: the system allocates them, so a host where the id is taken
# does not fail. Later tasks read the fact set below instead of assuming one.
# useradd also writes the subordinate range to /etc/subuid and /etc/subgid, from
# SUB_UID_MIN=100000 in shadow's compiled-in defaults.
# Writing our own range on top would let two accounts map the same outer ids.
- name: Create service group
  ansible.builtin.group:
    name: "{{ docker_service_group }}"
    state: present

- name: Create service user
  ansible.builtin.user:
    name: "{{ docker_service_user }}"
    group: "{{ docker_service_group }}"
    home: "{{ docker_service_home }}"
    shell: "{{ docker_service_shell }}"
    create_home: true
    state: present
  register: docker_service_user_result

# The user module reports uid on an unchanged run too, so a rerun re-reads the
# assigned id instead of renumbering the account.
- name: Record the uid the system allocated
  ansible.builtin.set_fact:
    docker_service_uid: "{{ docker_service_user_result.uid }}"

# useradd creates the account without a subordinate range when it cannot allocate
# one, and the setuptool then only prints instructions, so the run would go on to
# install a daemon that cannot start. Match the uid form too: useradd may write
# the numeric id instead of the name.
- name: Read the service user's subordinate id ranges
  ansible.builtin.command: "grep -E '^{{ docker_service_user }}:|^{{ docker_service_uid }}:' /etc/{{ item }}"
  loop:
    - subuid
    - subgid
  register: docker_subid
  changed_when: false
  failed_when: false
  check_mode: false
  # A dry run creates no user, so there is nothing to read.
  when: not ansible_check_mode

- name: Fail when the service user has no subordinate id range
  ansible.builtin.assert:
    that: docker_subid.results | map(attribute='stdout') | map('trim') | map('length') | min > 0
    fail_msg: >-
      {{ docker_service_user }} has no subordinate id range in /etc/subuid and
      /etc/subgid, so rootlesskit cannot create its user namespace. Allocate one
      with `usermod --add-subuids 100000-165535 --add-subgids 100000-165535
      {{ docker_service_user }}`.
  when: not ansible_check_mode

# `sudo -iu service` starts a login shell but not a login session, so nothing
# sets XDG_RUNTIME_DIR and `systemctl --user` cannot find the per-user bus.
- name: Point interactive shells at the per-user runtime directory
  ansible.builtin.blockinfile:
    path: "{{ docker_service_home }}/.bashrc"
    block: |
      export XDG_RUNTIME_DIR={{ docker_user_runtime_dir }}
    marker: "# {mark} ANSIBLE MANAGED: rootless docker"
    create: true
    owner: "{{ docker_service_user }}"
    group: "{{ docker_service_group }}"
    mode: "0644"

- name: Enable lingering so the daemon starts at boot without a login
  ansible.builtin.command: "loginctl enable-linger {{ docker_service_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ docker_service_user }}"

- name: Wait for the per-user runtime directory
  ansible.builtin.wait_for:
    path: "{{ docker_user_runtime_dir }}"
    timeout: 30

# --------------------------------------------------------------------------
# Kernel / AppArmor prerequisites for unprivileged user namespaces
# --------------------------------------------------------------------------

- name: Allow the rootless daemon to bind privileged ports
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "{{ docker_unprivileged_port_start }}"
    sysctl_file: /etc/sysctl.d/50-unprivileged-ports.conf
    sysctl_set: true
    reload: true

- name: Read the AppArmor restriction on unprivileged user namespaces
  ansible.builtin.slurp:
    src: /proc/sys/kernel/apparmor_restrict_unprivileged_userns
  register: docker_userns_restrict
  failed_when: false

- name: Record whether AppArmor restricts unprivileged user namespaces
  ansible.builtin.set_fact:
    docker_userns_restricted: "{{ docker_userns_restrict.content | default('') | b64decode | trim == '1' }}"

- name: Check the AppArmor ABI the profile is written against
  ansible.builtin.stat:
    path: /etc/apparmor.d/abi/4.0
  register: docker_apparmor_abi

# The `userns` rule needs abi/4.0, which Ubuntu 24.04+ ships with apparmor >= 4.0.
- name: Fail when the AppArmor restriction cannot be scoped to rootlesskit
  ansible.builtin.assert:
    that: docker_apparmor_abi.stat.exists
    fail_msg: >-
      AppArmor restricts unprivileged user namespaces on this host, but has no
      abi/4.0, so the rootlesskit profile cannot be written. Install apparmor >= 4.0.
  when: docker_userns_restricted | bool

# Ubuntu 24.04+ confines unprivileged user namespaces. Without this profile
# rootlesskit cannot create its namespace and dockerd never starts.
- name: Allow rootlesskit to create user namespaces (AppArmor)
  ansible.builtin.copy:
    dest: /etc/apparmor.d/usr.bin.rootlesskit
    mode: "0644"
    content: |
      abi <abi/4.0>,
      include <tunables/global>

      /usr/bin/rootlesskit flags=(unconfined) {
        userns,
        include if exists <local/usr.bin.rootlesskit>
      }
  when: docker_userns_restricted | bool
  notify: Restart apparmor

# Elsewhere nothing scopes the permission to one binary, so it has to be granted
# host-wide. Both knobs default to permissive; a hardened host at 0 is overridden
# because rootlesskit cannot start without a user namespace.
- name: Allow unprivileged user namespaces
  ansible.posix.sysctl:
    name: user.max_user_namespaces
    value: "{{ docker_max_user_namespaces }}"
    sysctl_file: /etc/sysctl.d/50-unprivileged-userns.conf
    sysctl_set: true
    reload: true
  when: not docker_userns_restricted | bool

- name: Read the Debian-specific unprivileged user namespace knob
  ansible.builtin.stat:
    path: /proc/sys/kernel/unprivileged_userns_clone
  register: docker_userns_clone

- name: Allow unprivileged user namespaces (Debian-specific knob, when present)
  ansible.posix.sysctl:
    name: kernel.unprivileged_userns_clone
    value: "1"
    sysctl_file: /etc/sysctl.d/50-unprivileged-userns.conf
    sysctl_set: true
    reload: true
  when:
    - not docker_userns_restricted | bool
    - docker_userns_clone.stat.exists

- name: Apply pending AppArmor changes before starting the daemon
  ansible.builtin.meta: flush_handlers

# --------------------------------------------------------------------------
# Rootless daemon
# --------------------------------------------------------------------------

- name: Install the rootless systemd user unit
  become: true
  become_user: "{{ docker_service_user }}"
  environment: "{{ docker_user_env }}"
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/dockerd-rootless-setuptool.sh', 'install'] + docker_setuptool_args }}"
  args:
    creates: "{{ docker_service_home }}/.config/systemd/user/docker.service"

- name: Create the rootless daemon config directory
  ansible.builtin.file:
    path: "{{ docker_service_home }}/.config/docker"
    state: directory
    owner: "{{ docker_service_user }}"
    group: "{{ docker_service_group }}"
    mode: "0755"

- name: Write the rootless daemon.json
  ansible.builtin.copy:
    dest: "{{ docker_service_home }}/.config/docker/daemon.json"
    content: "{{ docker_daemon_config | to_nice_json(indent=4) }}\n"
    owner: "{{ docker_service_user }}"
    group: "{{ docker_service_group }}"
    mode: "0664"
  notify: Restart rootless docker

- name: Enable and start the rootless daemon
  become: true
  become_user: "{{ docker_service_user }}"
  environment: "{{ docker_user_env }}"
  ansible.builtin.systemd_service:
    name: docker.service
    scope: user
    enabled: true
    state: started

- name: Apply pending daemon restarts
  ansible.builtin.meta: flush_handlers

- name: Verify the rootless daemon
  become: true
  become_user: "{{ docker_service_user }}"
  environment: "{{ docker_user_env }}"
  ansible.builtin.command: docker info --format '{% raw %}{{ .SecurityOptions }}{% endraw %}'
  register: docker_info_out
  changed_when: false
  check_mode: false

- name: Assert the daemon really is rootless
  ansible.builtin.assert:
    that: "'rootless' in docker_info_out.stdout"
    fail_msg: "Docker is running, but not in rootless mode: {{ docker_info_out.stdout }}"

# An apt upgrade replaces the dockerd binary on disk but leaves the running daemon on the old one.
# Restarting it is deliberately NOT automatic: it stops every container on the host.
- name: Read the running daemon version
  become: true
  become_user: "{{ docker_service_user }}"
  environment: "{{ docker_user_env }}"
  ansible.builtin.command: docker version --format '{% raw %}{{ .Server.Version }}{% endraw %}'
  register: docker_server_version_out
  changed_when: false
  failed_when: false
  check_mode: false

- name: Warn when the running daemon predates the installed packages
  ansible.builtin.debug:
    msg: >-
      Docker CE is now {{ docker_installed_version }}, but the rootless daemon is
      still running {{ docker_server_version_out.stdout | trim }} from the
      replaced binary. Pick a maintenance window and run
      `systemctl --user restart docker` as {{ docker_service_user }} — it stops
      every container on this host.
  when:
    - docker_installed_version | length > 0
    - docker_server_version_out.stdout | default('') | trim | length > 0
    - docker_server_version_out.stdout | trim != docker_installed_version
