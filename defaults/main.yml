---
docker_service_user: service
docker_service_group: service
docker_service_uid: 1001
docker_service_gid: 1001
docker_service_home: "/home/{{ docker_service_user }}"
docker_service_shell: /bin/bash

# Subordinate uid/gid range handed to the user namespace
docker_subid_start: 165536
docker_subid_count: 65536

# First (transport) port the rootless daemon can publish
docker_unprivileged_port_start: 0

docker_apt_repo_url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
docker_apt_key_url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"

# `latest` upgrades a host on every run; `present` freezes it. See README.md.
docker_packages_state: latest

docker_packages:
  - docker-ce
  - docker-ce-cli
  - docker-ce-rootless-extras
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Contents of ~/.config/docker/daemon.json for the service user.
docker_daemon_config: {}

# Extra arguments for `dockerd-rootless-setuptool.sh install`. Tests pass
# --skip-iptables: the setuptool checks /lib/modules for nf_tables, which a
# container does not have.
docker_setuptool_args: []

# Environment every command run *as the service user* needs so that it talks to
# the per-user systemd manager and the rootless daemon socket.
docker_user_runtime_dir: "/run/user/{{ docker_service_uid }}"
docker_user_env:
  XDG_RUNTIME_DIR: "{{ docker_user_runtime_dir }}"
  DBUS_SESSION_BUS_ADDRESS: "unix:path={{ docker_user_runtime_dir }}/bus"
  DOCKER_HOST: "unix://{{ docker_user_runtime_dir }}/docker.sock"
  PATH: /usr/bin:/sbin:/usr/sbin:/usr/local/sbin:/usr/local/bin:/bin
