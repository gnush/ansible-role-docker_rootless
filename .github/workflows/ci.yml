---
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install ansible-core ansible-lint

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint
        run: ansible-lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu2404
          - ubuntu2604
          - debian12
          - debian13
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install ansible-core molecule molecule-plugins[docker]

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Molecule
        run: molecule test --platform-name ${{ matrix.platform }} --destroy never
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      # The container needs host mounts and nested namespaces; see the comment
      # in molecule/default/converge.yml for what the scenario already works around.
      - name: Diagnostics
        if: failure()
        run: |
          docker exec ${{ matrix.platform }} cat /proc/1/cgroup || true
          docker exec ${{ matrix.platform }} mount | grep cgroup || true
          docker exec -u service -e XDG_RUNTIME_DIR=/run/user/1001 \
            -e DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1001/bus \
            ${{ matrix.platform }} systemctl --user status docker --no-pager || true
          docker exec -u service -e XDG_RUNTIME_DIR=/run/user/1001 \
            -e DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1001/bus \
            ${{ matrix.platform }} journalctl --user -u docker --no-pager || true
