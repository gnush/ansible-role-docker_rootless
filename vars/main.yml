---
# Internal: the apt pool name per `uname -m`. Docker publishes no riscv64 repo,
# so anything outside this mapping is refused rather than guessed.
docker_apt_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armhf
  ppc64le: ppc64el
  s390x: s390x

# Internal: the port drivers rootlesskit accepts, so an unknown value fails the
# run instead of the daemon at restart.
docker_port_driver_known:
  - builtin
  - slirp4netns
  - pasta

# Derived from the uid `docker_service_user` gets from the system, so an
# inventory variable must not be able to point them elsewhere. Role vars
# outrank host_vars/group_vars; `docker_service_uid` comes from tasks/main.yml.
docker_user_runtime_dir: "/run/user/{{ docker_service_uid }}"

# Environment every command run *as the service user* needs so that it talks to
# the per-user systemd manager and the rootless daemon socket.
docker_user_env:
  XDG_RUNTIME_DIR: "{{ docker_user_runtime_dir }}"
  DBUS_SESSION_BUS_ADDRESS: "unix:path={{ docker_user_runtime_dir }}/bus"
  DOCKER_HOST: "unix://{{ docker_user_runtime_dir }}/docker.sock"
  PATH: /usr/bin:/sbin:/usr/sbin:/usr/local/sbin:/usr/local/bin:/bin
